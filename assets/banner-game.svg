<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" shape-rendering="crispEdges" role="img" aria-label="Cena de jogo em pixel art: personagem correndo e pulando obstáculos">
  <style>
    text { font-family: "Courier New", Courier, monospace; font-weight: bold; }
    .tw { animation: tw 2.4s steps(2) infinite; }
    @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
    .blink { animation: bl 1.2s steps(1) infinite; }
    @keyframes bl { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }
    .obs { animation: mv 4s linear infinite; }
    @keyframes mv { from { transform: translateX(900px); } to { transform: translateX(-60px); } }
    .hero { animation: jump 4s infinite; }
    @keyframes jump {
      0%,65% { transform: translateY(0); animation-timing-function: ease-out; }
      77.5% { transform: translateY(-52px); animation-timing-function: ease-in; }
      90%,100% { transform: translateY(0); }
    }
    .l1 { animation: l1 .4s steps(1) infinite; }
    .l2 { animation: l2 .4s steps(1) infinite; }
    @keyframes l1 { 0%,49% { transform: translateY(0); } 50%,100% { transform: translateY(-6px); } }
    @keyframes l2 { 0%,49% { transform: translateY(-6px); } 50%,100% { transform: translateY(0); } }
    .coins { animation: mv2 6s linear infinite; }
    @keyframes mv2 { from { transform: translateX(960px); } to { transform: translateX(-120px); } }
    .spin { transform-box: fill-box; transform-origin: center; animation: sp .8s steps(4) infinite; }
    @keyframes sp { 0% { transform: scaleX(1); } 25% { transform: scaleX(.5); } 50% { transform: scaleX(.1); } 75% { transform: scaleX(.5); } 100% { transform: scaleX(1); } }
    .cloud { animation: cl 26s linear infinite; }
    @keyframes cl { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
  </style>
  <defs>
    <pattern id="chao" x="0" y="170" width="40" height="50" patternUnits="userSpaceOnUse">
      <rect width="40" height="50" fill="#1b1b24"/>
      <rect width="38" height="5" fill="#f1f1f1"/>
      <rect x="38" width="2" height="50" fill="#0b0b10"/>
      <rect y="25" width="40" height="2" fill="#0b0b10"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-40 0" dur="0.1667s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="900" height="220" fill="#0b0b10"/>

  <!-- estrelas -->
  <g fill="#f1f1f1">
    <rect class="tw" x="60" y="60" width="3" height="3"/>
    <rect class="tw" x="170" y="95" width="3" height="3" style="animation-delay:.6s"/>
    <rect class="tw" x="260" y="48" width="3" height="3" style="animation-delay:1.1s"/>
    <rect class="tw" x="390" y="120" width="3" height="3" style="animation-delay:.3s"/>
    <rect class="tw" x="520" y="55" width="3" height="3" style="animation-delay:1.7s"/>
    <rect class="tw" x="640" y="100" width="3" height="3" style="animation-delay:.9s"/>
    <rect class="tw" x="730" y="62" width="3" height="3" style="animation-delay:1.4s"/>
    <rect class="tw" x="820" y="115" width="3" height="3" style="animation-delay:.2s"/>
  </g>

  <!-- nuvens -->
  <g fill="#1e1e2a">
    <g class="cloud">
      <rect x="920" y="62" width="70" height="10"/><rect x="932" y="52" width="46" height="10"/><rect x="944" y="44" width="22" height="8"/>
    </g>
    <g class="cloud" style="animation-delay:-13s">
      <rect x="920" y="108" width="54" height="8"/><rect x="930" y="100" width="34" height="8"/>
    </g>
  </g>

  <!-- HUD -->
  <text x="20" y="30" fill="#f1f1f1" font-size="16">PLAYER 1  GIOVANE</text>
  <text x="880" y="30" fill="#f1f1f1" font-size="16" text-anchor="end">LVL 05</text>
  <text class="blink" x="450" y="92" fill="#4cc9f0" font-size="22" text-anchor="middle">PRESS START</text>

  <!-- moedas -->
  <g class="coins">
    <g class="spin"><rect x="0" y="104" width="12" height="14" fill="#ffd23f"/><rect x="3" y="107" width="3" height="8" fill="#fff3b0"/></g>
    <g class="spin" style="animation-delay:.2s"><rect x="40" y="104" width="12" height="14" fill="#ffd23f"/><rect x="43" y="107" width="3" height="8" fill="#fff3b0"/></g>
    <g class="spin" style="animation-delay:.4s"><rect x="80" y="104" width="12" height="14" fill="#ffd23f"/><rect x="83" y="107" width="3" height="8" fill="#fff3b0"/></g>
  </g>

  <!-- chão -->
  <rect y="170" width="900" height="50" fill="url(#chao)"/>

  <!-- obstáculo -->
  <g class="obs">
    <rect x="0" y="142" width="32" height="28" fill="#3a3a46"/>
    <rect x="-3" y="142" width="38" height="8" fill="#e6e6e6"/>
    <rect x="6" y="152" width="4" height="18" fill="#5b5b68"/>
  </g>

  <!-- personagem -->
  <g transform="translate(150,120)">
    <g class="hero">
      <rect x="0" y="20" width="5" height="12" fill="#5c5c66"/>
      <rect x="5" y="0" width="30" height="20" fill="#f1f1f1"/>
      <rect x="18" y="10" width="17" height="6" fill="#4cc9f0"/>
      <rect x="28" y="11" width="4" height="2" fill="#ffffff"/>
      <rect x="5" y="20" width="30" height="15" fill="#8d8d99"/>
      <rect x="12" y="22" width="8" height="5" fill="#4cc9f0"/>
      <rect x="5" y="30" width="30" height="3" fill="#f1f1f1"/>
      <rect x="30" y="22" width="10" height="6" fill="#f1f1f1"/>
      <rect class="l1" x="10" y="35" width="10" height="15" fill="#cfcfcf"/>
      <rect class="l2" x="25" y="35" width="10" height="15" fill="#cfcfcf"/>
    </g>
  </g>
</svg>
